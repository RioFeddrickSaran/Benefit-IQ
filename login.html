<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>BenefitIQ - Register</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <style>
    *{
      margin: 0;
      padding: 0;
    }</style>
</head>
<body id="regpage">
  <div class="box">
    <a href="index.html" class="back">← Back to Home</a>
    <div class="logo">
      <img src="images//logo.png"/>
      <h1>BenefitIQ</h1>
    </div>
    <h2>Log In</h2>
    <p>Log in BenefitIQ account</p>
    <form id="form">
      <label for="email">Email Address</label>
      <input
        type="email"
        id="email"
        name="email"
        placeholder="you@example.com"
        required/>
      <label for="password">Password</label>
      <input
        type="password"
        id="password"
        name="password"
        placeholder="Enter your password"
        required/>
      <div class="checkbox">
        <input type="checkbox" id="terms" required />
        <label for="terms">Remember me</label>
      </div>
      <button type="submit">Log In</button>
      <p class="bottom-text">Don't have an account?<a href="register.html"><span>Create an account</span></a></p>
    </form>
  </div>
</body>
</html>
